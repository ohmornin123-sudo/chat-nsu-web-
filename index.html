<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="남서울대 스마트 캠퍼스">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="CHAT-NSU">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>CHAT-NSU | 남서울대학교 스마트 캠퍼스</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div id="nsu-splash-loader">
    <div class="splash-box">
      <div class="nsu-ring"></div>
      <h3 class="splash-title">남서울대학교 스마트 캠퍼스</h3>
      <p class="splash-sub">실시간 학사 · 식단 · 셔틀 AI 로딩 중...</p>
    </div>
  </div>
  <style>
    #nsu-splash-loader {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }
    .splash-box {
      text-align: center;
      padding: 24px;
    }
    .nsu-ring {
      display: inline-block;
      width: 44px;
      height: 44px;
      border: 4px solid #E2E8F0;
      border-top-color: #003B70;
      border-radius: 50%;
      animation: nsu-spin 0.75s linear infinite;
    }
    @keyframes nsu-spin {
      to { transform: rotate(360deg); }
    }
    .splash-title {
      margin-top: 18px;
      font-size: 18px;
      font-weight: 700;
      color: #003B70;
      letter-spacing: -0.4px;
      margin-bottom: 0;
    }
    .splash-sub {
      margin-top: 6px;
      font-size: 12.5px;
      color: #64748B;
      margin-bottom: 0;
    }
  </style>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('nsu-splash-loader');
      if (loader) {
        loader.style.transition = 'opacity 0.35s ease';
        loader.style.opacity = '0';
        setTimeout(function() { loader.remove(); }, 350);
      }
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js?v=20261005_1730" async></script>
</body>
</html>
